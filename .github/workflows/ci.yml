name: CI

# Trigger: run on every push and on every pull request
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runs every hook defined in .pre-commit-config.yaml —
      # the same checks you'd run locally before committing.
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Checkout: clone the repo at this commit into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python — uses the matrix value, so this step
      # runs once per Python version, in parallel jobs
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Dependency install
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Test
      - name: Run pytest
        run: python -m pytest -v

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    # Only runs if BOTH lint and every matrix leg of test succeed
    needs: [lint, test]
    # Don't publish images from random PRs — only from main
    if: github.ref == 'refs/heads/main'

    # Grants this job permission to push to GHCR using the
    # auto-generated GITHUB_TOKEN — no manual secret needed
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository preserves the repo's actual casing
      # (e.g. "ZahraPakzad/CICD_Practice"), but registries require
      # lowercase image names — so compute a lowercase version here
      # and reuse it via $GITHUB_OUTPUT.
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.name }}:latest

  deploy-staging:
    name: Deploy to Render (staging)
    runs-on: ubuntu-latest
    # Only runs after the image has been successfully built and pushed
    needs: build
    environment: staging

    steps:
      # Hitting the deploy hook tells Render: "pull the latest image
      # and redeploy" — Render itself pulls from GHCR, we don't push
      # anything to Render directly from here.
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Only runs after staging has successfully redeployed
    needs: deploy-staging
    # Referencing the "production" environment is what makes this job
    # pause here: GitHub checks that environment's protection rules
    # before letting the job start, and since we added a required
    # reviewer, the job sits in a "Waiting" state until someone with
    # approval rights clicks Approve in the Actions run page.
    environment: production

    steps:
      # In a real setup this would hit a *separate* deploy hook
      # pointing at a distinct production Render service. We're
      # reusing the same one here since this is a single practice
      # app — the point of this job is the approval gate itself,
      # not a second live environment.
      - name: Trigger production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"