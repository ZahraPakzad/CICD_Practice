name: CI

# Trigger: run on every push and on every pull request
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff check
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Checkout: clone the repo at this commit into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python — uses the matrix value, so this step
      # runs once per Python version, in parallel jobs
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Dependency install
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Test
      - name: Run pytest
        run: python -m pytest -v